name: Public source API snapshot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check-public-api.py
