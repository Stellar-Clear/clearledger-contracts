name: Admin event source guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  admin-events:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-admin-events.py
