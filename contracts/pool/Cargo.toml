[package]
name = "clearledger-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
clearledger-ttl = { path = "../ttl" }
clearledger-pause = { workspace = true }

# Cross-contract deps (`clearledger-invoice`, `clearledger-escrow`) are
# intentionally `dev-dependencies`: the pool only references the invoice and
# escrow contracts by `Address` via `env.invoke_contract(...)` and never imports
# their types in production code. The crates are pulled in solely to wire the
# real `InvoiceContract` / `EscrowContract` clients into the cross-contract test
# suite (see `src/test.rs`). Production builds (`cargo build --release`) must
# not pull them in to keep the WASM binary as small as possible.
# Refs: issue #309.
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
clearledger-invoice = { workspace = true }
clearledger-escrow = { workspace = true }
# Test-only: wires the real RegistryContract into an integration test that
# drives is_verified through production code instead of the MockRegistry
# stand-in used elsewhere in this file. Refs: issue #631.
clearledger-registry = { workspace = true }
clearledger-test-utils = { workspace = true }
# Test-only: signs attestation payloads with a real secp256k1 key so the
# invoice contract's submit_attestation gate can be satisfied in pool tests.
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
proptest = { workspace = true }

[features]
testutils = ["soroban-sdk/testutils"]
